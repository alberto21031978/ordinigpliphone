<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GPL Mobile - iPhone Edition (JSONBin.io)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: #000000;
      color: #f2f2f7;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .ios-card { background: #1c1c1e; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); }
    .tank-bar { transition: width 0.3s ease-out; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-24">

  <!-- TOP BAR IPHONE -->
  <header class="p-3 bg-[#161618] border-b border-white/10 sticky top-0 z-40">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold text-sm">
          <i class="fa-solid fa-mobile-screen"></i>
        </div>
        <div>
          <h1 class="text-sm font-semibold tracking-tight text-white leading-none">GPL Mobile Driver</h1>
          <span class="text-[10px] text-cyan-400 font-mono">JSONBin Cloud</span>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="fetchJsonBinOrders()" class="px-2 py-1 bg-white/10 rounded-lg text-xs text-cyan-300">
          <i class="fa-solid fa-arrows-rotate" id="phoneRefreshIcon"></i>
        </button>
        <button onclick="toggleConfigModal()" class="px-2 py-1 bg-white/10 rounded-lg text-xs text-slate-300" title="Impostazioni JSONBin">
          <i class="fa-solid fa-gear"></i>
        </button>
        <button onclick="confirmResetAllData()" class="px-2 py-1 bg-rose-950 text-rose-300 rounded-lg text-xs border border-rose-800" title="Azzera ordini">
          <i class="fa-solid fa-trash-can"></i>
        </button>
        <span class="w-2.5 h-2.5 rounded-full bg-slate-500" id="phoneSyncDot"></span>
      </div>
    </div>
  </header>

  <!-- MODALE CONFIGURAZIONE JSONBIN -->
  <div id="configModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="ios-card w-full max-w-sm p-4 space-y-3">
      <h3 class="text-sm font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-cloud text-cyan-400"></i> Parametri JSONBin.io
      </h3>
      <p class="text-[11px] text-slate-400">Inserisci le stesse credenziali usate sul Mac per sincronizzare gli ordini.</p>
      <div>
        <label class="block text-[11px] text-slate-400 mb-1">Bin ID</label>
        <input type="text" id="phoneBinIdInput" placeholder="es. 660f..." class="w-full bg-black border border-white/10 rounded-xl px-3 py-2 text-xs font-mono text-cyan-300 focus:outline-none">
      </div>
      <div>
        <label class="block text-[11px] text-slate-400 mb-1">Master Key</label>
        <input type="password" id="phoneApiKeyInput" placeholder="$2a$10..." class="w-full bg-black border border-white/10 rounded-xl px-3 py-2 text-xs font-mono text-cyan-300 focus:outline-none">
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="savePhoneConfig()" class="flex-1 py-2 bg-cyan-600 rounded-xl text-xs font-semibold text-white">Salva & Collega</button>
        <button onclick="toggleConfigModal()" class="px-3 py-2 bg-white/10 rounded-xl text-xs text-slate-300">Chiudi</button>
      </div>
    </div>
  </div>

  <!-- MAIN VISTE TOUCH -->
  <main class="p-4 flex-grow space-y-4 max-w-md mx-auto w-full">
    
    <!-- SCHEDA VOCALE -->
    <div class="ios-card p-4 relative overflow-hidden">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Dettatura Vocale Rapida</span>
        <button onclick="demoFill()" class="text-[10px] text-cyan-400 bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800">Frase Test</button>
      </div>

      <button id="voiceBtnPhone" onclick="toggleVoicePhone()" class="w-full py-3.5 bg-gradient-to-r from-cyan-600 to-blue-600 active:scale-95 text-white font-medium rounded-xl flex items-center justify-center gap-3 shadow-lg shadow-cyan-950/50 transition-all">
        <i class="fa-solid fa-microphone text-lg" id="phoneMicIcon"></i>
        <span id="phoneMicText" class="text-sm font-semibold">Tocca e Parla</span>
      </button>

      <div id="transcriptBoxPhone" class="mt-2 text-[11px] text-slate-400 font-mono bg-black/50 p-2 rounded-lg border border-white/5 truncate">
        Pronto per registrare l'ordine...
      </div>
    </div>

    <!-- SELETTORE TAB -->
    <div class="grid grid-cols-2 p-1 bg-[#1c1c1e] rounded-xl border border-white/10">
      <button id="tabBtnForm" onclick="switchTab('form')" class="py-2 text-xs font-semibold rounded-lg bg-cyan-600 text-white shadow">
        Nuovo Ordine
      </button>
      <button id="tabBtnList" onclick="switchTab('list')" class="py-2 text-xs font-semibold rounded-lg text-slate-400">
        Riepilogo (<span id="countBadge">0</span>)
      </button>
    </div>

    <!-- VISTA 1: FORM TOUCH -->
    <div id="viewForm" class="space-y-4">
      <form id="orderFormPhone" onsubmit="handlePhoneSubmit(event)" class="ios-card p-4 space-y-3.5">
        <input type="hidden" id="phoneOrderId">

        <div>
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Nominativo Cliente *</label>
          <input type="text" id="phoneCustName" required placeholder="Es. Mario Rossi" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Numero di Telefono *</label>
          <input type="tel" id="phoneCustPhone" required placeholder="Es. 3331234567" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-white font-mono focus:outline-none focus:border-cyan-500">
        </div>

        <!-- Cisterna touch con percentuale a digitazione libera -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-[11px] font-medium text-slate-400">Livello Attuale Cisterna</span>
            <div class="flex items-center gap-1">
              <input type="number" id="phoneTankNumber" min="0" max="100" value="15" oninput="setTank(this.value)" class="w-16 bg-black text-cyan-400 font-bold font-mono text-xs text-right border border-white/10 rounded-lg px-2 py-0.5 focus:outline-none focus:border-cyan-500">
              <span class="text-xs text-cyan-400 font-bold font-mono">%</span>
            </div>
          </div>
          <div class="w-full bg-black/60 rounded-full h-3 border border-white/10 p-0.5 mb-2 overflow-hidden">
            <div id="phoneTankBar" class="tank-bar h-full rounded-full bg-rose-500" style="width: 15%;"></div>
          </div>
          <div class="grid grid-cols-4 gap-1.5">
            <button type="button" onclick="setTank(10)" class="py-1 bg-black/40 border border-white/10 rounded-lg text-xs font-mono text-slate-300">10%</button>
            <button type="button" onclick="setTank(20)" class="py-1 bg-black/40 border border-white/10 rounded-lg text-xs font-mono text-slate-300">20%</button>
            <button type="button" onclick="setTank(40)" class="py-1 bg-black/40 border border-white/10 rounded-lg text-xs font-mono text-slate-300">40%</button>
            <button type="button" onclick="setTank(60)" class="py-1 bg-black/40 border border-white/10 rounded-lg text-xs font-mono text-slate-300">60%</button>
          </div>
        </div>

        <!-- Litri e Prezzo -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">Litri Ordinati *</label>
            <input type="number" id="phoneLiters" required min="1" step="10" placeholder="1000" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2.5 text-sm font-mono text-white focus:outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-400 mb-1">Prezzo (€/L)</label>
            <input type="number" id="phonePrice" step="0.001" placeholder="0.80" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2.5 text-sm font-mono text-white focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-400 mb-1">Note Consegna</label>
          <textarea id="phoneNotes" rows="2" placeholder="Indicazioni stradali..." class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500"></textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-emerald-600 active:bg-emerald-500 text-white font-semibold rounded-xl text-sm shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> Salva e Sincronizza
        </button>
      </form>
    </div>

    <!-- VISTA 2: LISTA GIORNALIERA CONSEGNE -->
    <div id="viewList" class="space-y-3 hidden">
      <div class="ios-card p-3.5 flex justify-between items-center">
        <div>
          <span class="text-[10px] text-slate-400 uppercase font-semibold">Totale Consegne Oggi</span>
          <p id="phoneTotalLiters" class="text-lg font-bold text-cyan-400 font-mono">0 Litri</p>
        </div>
        <button onclick="exportPhoneDailyPDF()" class="bg-rose-600 active:bg-rose-500 text-white px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-file-pdf"></i> Report PDF
        </button>
      </div>

      <div id="phoneOrdersCardsContainer" class="space-y-3">
        <!-- Schede dinamiche -->
      </div>
    </div>

  </main>

  <!-- STATO BOTTOM -->
  <div class="fixed bottom-0 left-0 right-0 p-2.5 bg-[#161618] border-t border-white/10 flex items-center justify-between px-4 text-xs">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-cloud text-cyan-400 text-xs"></i>
      <span class="text-slate-400 text-[11px]" id="phoneStatusMsg">JSONBin.io</span>
    </div>
    <span class="text-[10px] text-slate-500" id="phoneLastSync">Auto-refresh On</span>
  </div>

  <script>
    const STORAGE_KEY = 'GPL_JSONBIN_ORDERS_CACHE';
    const CFG_BIN_ID = 'GPL_JB_BIN_ID';
    const CFG_API_KEY = 'GPL_JB_API_KEY';
    let currentTankVal = 15;

    document.getElementById('phoneBinIdInput').value = localStorage.getItem(CFG_BIN_ID) || '';
    document.getElementById('phoneApiKeyInput').value = localStorage.getItem(CFG_API_KEY) || '';

    function toggleConfigModal() {
      const modal = document.getElementById('configModal');
      modal.classList.toggle('hidden');
    }

    function savePhoneConfig() {
      const b = document.getElementById('phoneBinIdInput').value.trim();
      const k = document.getElementById('phoneApiKeyInput').value.trim();
      if (!b || !k) {
        alert("Inserisci Bin ID e Master Key!");
        return;
      }
      localStorage.setItem(CFG_BIN_ID, b);
      localStorage.setItem(CFG_API_KEY, k);
      toggleConfigModal();
      fetchJsonBinOrders();
    }

    function getLocalOrders() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function setLocalOrders(arr) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
      renderPhoneOrders();
    }

    async function fetchJsonBinOrders() {
      const bId = localStorage.getItem(CFG_BIN_ID);
      const aKey = localStorage.getItem(CFG_API_KEY);

      if (!bId || !aKey) {
        updatePhoneSyncStatus(false, "Manca Configurazione");
        return;
      }

      const icon = document.getElementById('phoneRefreshIcon');
      if (icon) icon.classList.add('fa-spin');

      try {
        const resp = await fetch(`https://api.jsonbin.io/v3/b/${bId}/latest`, {
          method: 'GET',
          headers: { 'X-Master-Key': aKey }
        });

        if (!resp.ok) throw new Error("Status " + resp.status);
        const data = await resp.json();
        const orders = Array.isArray(data.record) ? data.record : [];
        setLocalOrders(orders);
        updatePhoneSyncStatus(true, "Cloud Sincronizzato");
      } catch (e) {
        console.error(e);
        updatePhoneSyncStatus(false, "Errore Connessione");
      } finally {
        if (icon) icon.classList.remove('fa-spin');
      }
    }

    async function pushJsonBinOrders(orders) {
      const bId = localStorage.getItem(CFG_BIN_ID);
      const aKey = localStorage.getItem(CFG_API_KEY);

      setLocalOrders(orders);

      if (!bId || !aKey) {
        alert("Configura il Bin ID nelle impostazioni per sincronizzare col Mac.");
        return;
      }

      updatePhoneSyncStatus(true, "Invio al cloud...");

      try {
        const resp = await fetch(`https://api.jsonbin.io/v3/b/${bId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': aKey
          },
          body: JSON.stringify(orders)
        });

        if (!resp.ok) throw new Error("Errore: " + resp.status);
        updatePhoneSyncStatus(true, "Cloud Sincronizzato");
      } catch (e) {
        console.error(e);
        updatePhoneSyncStatus(false, "Errore Salvataggio");
        alert("Impossibile salvare su JSONBin.io: verifica chiavi.");
      }
    }

    // Reset Totale Dati da Mobile
    async function confirmResetAllData() {
      const check = confirm("ATTENZIONE: Stai per eliminare TUTTI gli ordini sia dal telefono che dal cloud JSONBin. Continuare?");
      if (!check) return;

      const code = prompt("Digita 'RESET' per procedere con la cancellazione:");
      if (code !== "RESET") {
        alert("Operazione annullata.");
        return;
      }

      await pushJsonBinOrders([]);
      alert("Tutti gli ordini sono stati azzerati!");
    }

    function updatePhoneSyncStatus(ok, txt) {
      const dot = document.getElementById('phoneSyncDot');
      document.getElementById('phoneStatusMsg').innerText = txt;
      if (ok) {
        dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
        document.getElementById('phoneLastSync').innerText = new Date().toLocaleTimeString();
      } else {
        dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
      }
    }

    function setTank(val) {
      val = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
      currentTankVal = val;
      document.getElementById('phoneTankNumber').value = val;
      const bar = document.getElementById('phoneTankBar');
      bar.style.width = val + '%';
      if (val <= 15) bar.className = 'tank-bar h-full rounded-full bg-rose-500';
      else if (val <= 30) bar.className = 'tank-bar h-full rounded-full bg-amber-500';
      else bar.className = 'tank-bar h-full rounded-full bg-cyan-500';
    }

    function switchTab(tab) {
      if (tab === 'form') {
        document.getElementById('viewForm').classList.remove('hidden');
        document.getElementById('viewList').classList.add('hidden');
        document.getElementById('tabBtnForm').className = "py-2 text-xs font-semibold rounded-lg bg-cyan-600 text-white shadow";
        document.getElementById('tabBtnList').className = "py-2 text-xs font-semibold rounded-lg text-slate-400";
      } else {
        document.getElementById('viewForm').classList.add('hidden');
        document.getElementById('viewList').classList.remove('hidden');
        document.getElementById('tabBtnForm').className = "py-2 text-xs font-semibold rounded-lg text-slate-400";
        document.getElementById('tabBtnList').className = "py-2 text-xs font-semibold rounded-lg bg-cyan-600 text-white shadow";
      }
    }

    async function handlePhoneSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('phoneOrderId').value || 'ORD-' + Date.now().toString(36).toUpperCase();
      const today = new Date().toISOString().split('T')[0];
      const tankVal = parseInt(document.getElementById('phoneTankNumber').value, 10) || 0;

      const newOrder = {
        id: id,
        date: today,
        time: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }),
        custName: document.getElementById('phoneCustName').value.trim(),
        custPhone: document.getElementById('phoneCustPhone').value.trim(),
        tankLevel: tankVal,
        liters: parseInt(document.getElementById('phoneLiters').value, 10),
        price: document.getElementById('phonePrice').value ? parseFloat(document.getElementById('phonePrice').value) : null,
        notes: document.getElementById('phoneNotes').value.trim()
      };

      let list = getLocalOrders();
      const idx = list.findIndex(o => o.id === id);
      if (idx >= 0) list[idx] = newOrder;
      else list.unshift(newOrder);

      await pushJsonBinOrders(list);

      document.getElementById('phoneOrderId').value = '';
      document.getElementById('phoneCustName').value = '';
      document.getElementById('phoneCustPhone').value = '';
      document.getElementById('phoneLiters').value = '';
      document.getElementById('phonePrice').value = '';
      document.getElementById('phoneNotes').value = '';
      setTank(15);

      switchTab('list');
    }

    async function deletePhoneOrder(id) {
      if (confirm('Eliminare ordine dal Cloud?')) {
        let list = getLocalOrders().filter(o => o.id !== id);
        await pushJsonBinOrders(list);
      }
    }

    function sendWhatsApp(id) {
      const order = getLocalOrders().find(o => o.id === id);
      if (!order) return;
      const msg = `*CONSEGNA GPL*%0A*Cliente:* ${order.custName}%0A*Tel:* ${order.custPhone}%0A*Livello Cisterna:* ${order.tankLevel}%%0A*Litri:* ${order.liters} L%0A*Prezzo:* ${order.price ? '€ ' + order.price : 'Listino'}%0A*Note:* ${order.notes || 'Nessuna'}`;
      window.open(`https://wa.me/?text=${msg}`, '_blank');
    }

    function renderPhoneOrders() {
      const today = new Date().toISOString().split('T')[0];
      const orders = getLocalOrders().filter(o => o.date === today);

      document.getElementById('countBadge').innerText = orders.length;
      let totalLiters = 0;
      const container = document.getElementById('phoneOrdersCardsContainer');
      container.innerHTML = '';

      if (orders.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-xs text-slate-500">Nessuna consegna registrata per oggi nel cloud.</div>';
      }

      orders.forEach(o => {
        totalLiters += (o.liters || 0);
        const card = document.createElement('div');
        card.className = "ios-card p-3.5 space-y-2 relative";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-white text-sm">${o.custName}</span>
            <span class="text-xs font-mono font-bold text-cyan-400 bg-cyan-950/60 px-2 py-0.5 rounded border border-cyan-800">${o.liters} L</span>
          </div>
          <div class="text-xs text-slate-400 flex items-center justify-between">
            <span>Cisterna: <strong class="text-white">${o.tankLevel}%</strong></span>
            <span>${o.price ? '€ ' + o.price.toFixed(3) + '/L' : 'Listino'}</span>
          </div>
          ${o.notes ? `<div class="text-[11px] bg-black/40 p-2 rounded text-slate-300 italic border border-white/5">${o.notes}</div>` : ''}
          <div class="pt-2 flex items-center gap-2 border-t border-white/5">
            <a href="tel:${o.custPhone}" class="flex-1 py-1.5 bg-emerald-700/40 text-emerald-300 border border-emerald-600/30 rounded-lg text-center text-xs font-medium flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-phone"></i> Chiama
            </a>
            <button onclick="sendWhatsApp('${o.id}')" class="flex-1 py-1.5 bg-green-700/40 text-green-300 border border-green-600/30 rounded-lg text-center text-xs font-medium flex items-center justify-center gap-1.5">
              <i class="fa-brands fa-whatsapp"></i> Invia WA
            </button>
            <button onclick="deletePhoneOrder('${o.id}')" class="px-3 py-1.5 bg-rose-950 text-rose-400 rounded-lg text-xs">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('phoneTotalLiters').innerText = totalLiters.toLocaleString('it-IT') + ' Litri';
    }

    function exportPhoneDailyPDF() {
      const today = new Date().toISOString().split('T')[0];
      const orders = getLocalOrders().filter(o => o.date === today);

      if (orders.length === 0) {
        alert('Nessuna consegna odierna da esportare.');
        return;
      }

      const temp = document.createElement('div');
      temp.style.padding = '15px';
      temp.style.color = '#000';
      temp.style.fontFamily = 'Arial, sans-serif';

      let listHtml = orders.map((o, idx) => `
        <div style="border-bottom: 1px solid #ddd; padding: 6px 0; font-size: 11px;">
          <strong>#${idx+1} ${o.custName}</strong> - Tel: ${o.custPhone}<br>
          Cisterna: ${o.tankLevel}% | Ordinati: <strong>${o.liters} Litri</strong> | Prezzo: ${o.price || 'Listino'}<br>
          <em>Note: ${o.notes || '-'}</em>
        </div>
      `).join('');

      temp.innerHTML = `
        <h3 style="text-align: center; color: #0284c7; margin-bottom: 5px;">REPORT CONSEGNE GPL - ${today}</h3>
        <p style="text-align: center; font-size: 11px; margin-top: 0;">Sincronizzato tramite JSONBin.io</p>
        <div>${listHtml}</div>
      `;

      html2pdf().set({
        margin: 10,
        filename: `Consegne_GPL_${today}.pdf`,
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(temp).save();
    }

    // Vocale iPhone
    let phoneRec = null;
    let isRecPhone = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const Sp = window.SpeechRecognition || window.webkitSpeechRecognition;
      phoneRec = new Sp();
      phoneRec.lang = 'it-IT';
      phoneRec.onstart = () => {
        isRecPhone = true;
        document.getElementById('phoneMicText').innerText = "In ascolto...";
        document.getElementById('phoneMicIcon').className = "fa-solid fa-circle-notch fa-spin text-rose-400";
      };
      phoneRec.onresult = (evt) => {
        const text = evt.results[0][0].transcript;
        document.getElementById('transcriptBoxPhone').innerText = `"${text}"`;
        parseVoice(text);
      };
      phoneRec.onerror = () => stopPhoneRec();
      phoneRec.onend = () => stopPhoneRec();
    }

    function toggleVoicePhone() {
      if (!phoneRec) {
        alert("Riconoscimento vocale non supportato.");
        return;
      }
      if (isRecPhone) phoneRec.stop();
      else phoneRec.start();
    }

    function stopPhoneRec() {
      isRecPhone = false;
      document.getElementById('phoneMicText').innerText = "Tocca e Parla";
      document.getElementById('phoneMicIcon').className = "fa-solid fa-microphone";
    }

    function parseVoice(str) {
      const text = str.toLowerCase();
      const phoneMatch = text.match(/(?:telefono|cellulare|numero)?\s*([0-9\s]{8,13})/i);
      if (phoneMatch) {
        const clean = phoneMatch[1].replace(/\s+/g, '');
        if (clean.length >= 8) document.getElementById('phoneCustPhone').value = clean;
      }
      const tankMatch = text.match(/(\d{1,3})\s*(?:%|percento)/i) || text.match(/(?:serbatoio al|livello al)\s*(\d{1,3})/i);
      if (tankMatch) {
        const val = Math.min(parseInt(tankMatch[1], 10), 100);
        setTank(val);
      }
      const literMatch = text.match(/(\d{2,5})\s*(?:litri|l\b)/i) || text.match(/(?:quantità|metti)\s*(\d{2,5})/i);
      if (literMatch) document.getElementById('phoneLiters').value = literMatch[1];

      const priceMatch = text.match(/(?:prezzo|euro)?\s*(\d+[,\.]\d{1,3})\s*(?:euro|al litro)?/i);
      if (priceMatch) document.getElementById('phonePrice').value = priceMatch[1].replace(',', '.');

      const nameMatch = text.match(/(?:ordine per|cliente|signor|sig\.?|ditta)\s+([a-zA-Zàèéìòù\s]+?)(?=\s+(?:telefono|serbatoio|con|litri|prezzo|note|$))/i);
      if (nameMatch) {
        const n = nameMatch[1].trim();
        document.getElementById('phoneCustName').value = n.charAt(0).toUpperCase() + n.slice(1);
      }
    }

    function demoFill() {
      const demo = "Nuovo ordine per Mario Rossi telefono 3331234567 serbatoio al 25 percento litri 1000 prezzo 0.81 euro note chiamare prima";
      document.getElementById('transcriptBoxPhone').innerText = `"${demo}"`;
      parseVoice(demo);
    }

    setInterval(() => {
      if (localStorage.getItem(CFG_BIN_ID) && localStorage.getItem(CFG_API_KEY)) {
        fetchJsonBinOrders();
      }
    }, 20000);

    setTank(15);
    renderPhoneOrders();
    if (localStorage.getItem(CFG_BIN_ID) && localStorage.getItem(CFG_API_KEY)) {
      fetchJsonBinOrders();
    }
  </script>
</body>
</html>
